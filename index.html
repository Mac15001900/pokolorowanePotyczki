<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grid Base Strategy — PixiJS</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="ui">
    <label>Columns: <input id="cols" type="number" min="3" value="10" /></label>
    <label>Rows: <input id="rows" type="number" min="3" value="8" /></label>
    <label>Tile Size: <input id="tileSize" type="number" min="16" value="64" /></label>
    <button id="apply">Apply</button>
    <button id="clear">Clear Tokens</button>
  </div>

  <div id="stage"></div>

  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.4/pixi.min.js"></script> -->
  <script src="https://pixijs.download/v8.18.1/pixi.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
